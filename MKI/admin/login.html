<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrador</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../loader.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc;
            background-image: linear-gradient(rgba(248, 250, 252, 0), rgba(248, 250, 252, 0)), url('../img/tiburon.png');
            background-position: center 100%;
            background-size: 55%;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Poppins', sans-serif;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 59, 142, 0.1), inset 0 2px 4px rgba(255, 255, 255, 0.3);
            animation: slideUp 0.6s ease-out;
            border: 1px solid rgba(100, 181, 246, 0.3);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #003B8E 0%, #0056D6 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 36px;
            color: white;
            box-shadow: 0 8px 24px rgba(0, 59, 142, 0.25);
        }

        .login-header h1 {
            font-size: 28px;
            color: #003B8E;
            margin: 0;
            font-weight: 700;
        }

        .login-header p {
            color: #64a3d4;
            margin: 8px 0 0 0;
            font-size: 14px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            font-size: 18px;
            color: #0056D6;
            z-index: 1;
        }

        .login-form input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 2px solid rgba(100, 181, 246, 0.3);
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            box-sizing: border-box;
            background-color: rgba(255, 255, 255, 0.9);
        }

        .login-form input:focus {
            outline: none;
            border-color: #0056D6;
            box-shadow: 0 0 0 3px rgba(0, 86, 214, 0.1);
            background: white;
        }

        .login-form input::placeholder {
            color: #94a3b8;
        }

        .btn-login {
            padding: 14px 24px;
            background: linear-gradient(135deg, #003B8E 0%, #0056D6 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Poppins', sans-serif;
            margin-top: 10px;
            box-shadow: 0 8px 16px rgba(0, 59, 142, 0.15);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(0, 59, 142, 0.25);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-message {
            padding: 12px 16px;
            background: #fee;
            color: #c33;
            border-radius: 8px;
            font-size: 14px;
            border-left: 4px solid #c33;
            display: none;
            animation: slideDown 0.3s ease;
        }

        .error-message.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .back-button {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(0, 86, 214, 0.1);
            color: #0056D6;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            border: 1px solid rgba(0, 86, 214, 0.2);
        }

        .back-button:hover {
            background: rgba(0, 86, 214, 0.15);
            transform: translateX(-5px);
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #94a3b8;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 20px;
                padding: 30px 20px;
            }

            .login-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

<div class="login-container">
    <a href="../index.html" class="back-button">
        <i class="fas fa-arrow-left"></i> Volver a inicio
    </a>

    <div class="login-header">
        <div class="login-icon">
            <i class="fas fa-lock"></i>
        </div>
        <h1>Administrador</h1>
        <p>Acceso restringido al panel de control</p>
    </div>

    <form class="login-form" onsubmit="iniciarSesion(event)">
        <div class="input-group">
            <i class="fas fa-user input-icon"></i>
            <input type="text" id="usuario" placeholder="Nombre de usuario" required>
        </div>

        <div class="input-group">
            <i class="fas fa-key input-icon"></i>
            <input type="password" id="password" placeholder="Contraseña" required>
        </div>

        <button type="submit" class="btn-login">
            <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
        </button>

        <div id="mensaje" class="error-message"></div>
    </form>

    <div class="login-footer">
        <p>© 2026 Sistema de Consulta de ETS • Acceso Administrativo</p>
    </div>
</div>

<!-- LOADER MODERNO - CARGAR PRIMERO -->
<script src="../loader.js"></script>

<script>
// Inicializar loader sin ocultarlo automáticamente
initLoader({hideOnLoad: false});

async function iniciarSesion(event) {
    event.preventDefault();

    const usuario = document.getElementById("usuario").value;
    const password = document.getElementById("password").value;
    const mensajeDiv = document.getElementById("mensaje");

    try {
        const respuesta = await fetch("../php/login.php", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                usuario,
                password
            })
        });

        const datos = await respuesta.json();

        if(datos.success){
            mensajeDiv.classList.remove('show');
            showLoader();
            setTimeout(() => {
                window.location.href = "admin.php";
            }, 800);
        }else{
            mensajeDiv.textContent = "❌ Usuario o contraseña incorrectos";
            if(datos.error) {
                mensajeDiv.textContent = "❌ Error: " + datos.error;
            }
            mensajeDiv.classList.add('show');
        }
    } catch(error) {
        console.error("Error completo:", error);
        mensajeDiv.textContent = "❌ Error al conectar con el servidor: " + error.message;
        mensajeDiv.classList.add('show');
    }
}

</script>

</body>
</html>
